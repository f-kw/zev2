<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ダイジェスト演出：3つの比較</title>
<style>body{margin:0;background:#f4f4f1;color:#20252b;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:27px}h2{font-size:21px;margin:0}nav{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0}a{color:#17518b}section{scroll-margin-top:18px;background:white;border:1px solid #d8dbdc;border-radius:14px;padding:22px;margin:24px 0}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}button{font:inherit;padding:10px 18px;cursor:pointer;background:#194e72;color:white;border:0;border-radius:7px}button:focus-visible,input:focus-visible{outline:3px solid #e5ac24;outline-offset:3px}video{width:100%;aspect-ratio:16/9;background:#000}fieldset{border:0;padding:12px 0;display:flex;gap:18px;flex-wrap:wrap}legend{font-weight:700;padding-top:16px}label{cursor:pointer}input[type=radio]{margin-right:6px}.comment{display:flex;gap:12px;align-items:center}.comment input{flex:1;min-width:80px;font:inherit;padding:8px;border:1px solid #aeb8c0;border-radius:5px}textarea{display:block;width:100%;box-sizing:border-box;margin-top:14px;min-height:110px;font:inherit;padding:12px}#copy-status{margin-left:16px}</style>
<main><h1>ダイジェスト演出：3つの比較</h1><nav><a href="#emphasis">比較1</a><a href="#reaction">比較2</a><a href="#black">比較3</a></nav><section id="emphasis" data-title="比較1：normal vs emphasis"><h2>比較1：normal vs emphasis</h2><p>通常会話の字幕</p>
 <div class="actions"><button data-case="emphasis" data-side="A">Aを再生：normal</button><button data-case="emphasis" data-side="B">Bを再生：emphasis</button><span id="emphasis-now" aria-live="polite">A：normal</span></div>
 <video id="emphasis-video" controls preload="metadata" playsinline src="emphasis-A.mp4"></video>
 <fieldset><legend>どちらが良いか</legend><label><input type="radio" name="emphasis" value="Aが良い">Aが良い</label><label><input type="radio" name="emphasis" value="Bが良い">Bが良い</label><label><input type="radio" name="emphasis" value="変わらない">変わらない</label><label><input type="radio" name="emphasis" value="どちらも悪い">どちらも悪い</label></fieldset><label class="comment">コメント（任意）<input name="emphasis-comment" type="text"></label></section><section id="reaction" data-title="比較2：normal vs reaction"><h2>比較2：normal vs reaction</h2><p>「やったー!」</p>
 <div class="actions"><button data-case="reaction" data-side="A">Aを再生：normal</button><button data-case="reaction" data-side="B">Bを再生：reaction</button><span id="reaction-now" aria-live="polite">A：normal</span></div>
 <video id="reaction-video" controls preload="metadata" playsinline src="reaction-A.mp4"></video>
 <fieldset><legend>どちらが良いか</legend><label><input type="radio" name="reaction" value="Aが良い">Aが良い</label><label><input type="radio" name="reaction" value="Bが良い">Bが良い</label><label><input type="radio" name="reaction" value="変わらない">変わらない</label><label><input type="radio" name="reaction" value="どちらも悪い">どちらも悪い</label></fieldset><label class="comment">コメント（任意）<input name="reaction-comment" type="text"></label></section><section id="black" data-title="比較3：normal cut vs black"><h2>比較3：normal cut vs black</h2><p>場面の接続</p>
 <div class="actions"><button data-case="black" data-side="A">Aを再生：normal cut</button><button data-case="black" data-side="B">Bを再生：black</button><span id="black-now" aria-live="polite">A：normal cut</span></div>
 <video id="black-video" controls preload="metadata" playsinline src="black-A.mp4"></video>
 <fieldset><legend>どちらが良いか</legend><label><input type="radio" name="black" value="Aが良い">Aが良い</label><label><input type="radio" name="black" value="Bが良い">Bが良い</label><label><input type="radio" name="black" value="変わらない">変わらない</label><label><input type="radio" name="black" value="どちらも悪い">どちらも悪い</label></fieldset><label class="comment">コメント（任意）<input name="black-comment" type="text"></label></section>
<button id="copy">回答をコピー</button><span id="copy-status" aria-live="polite"></span><textarea id="answers" aria-label="回答文" readonly placeholder="選んだ回答がここに表示されます"></textarea></main>
<script>
const titles={emphasis:['normal','emphasis'],reaction:['normal','reaction'],black:['normal cut','black']};
for(const button of document.querySelectorAll('[data-case]')) button.addEventListener('click',async()=>{
 for(const v of document.querySelectorAll('video'))v.pause();
 const key=button.dataset.case,side=button.dataset.side,v=document.getElementById(key+'-video');
 v.src=key+'-'+side+'.mp4';document.getElementById(key+'-now').textContent=side+'：'+titles[key][side==='A'?0:1];
 try{await v.play()}catch{document.getElementById(key+'-now').textContent+='（再生ボタンを押してください）'}
});
function answerText(){return [...document.querySelectorAll('section')].map(s=>{const choice=document.querySelector('input[name="'+s.id+'"]:checked')?.value??'未回答';const comment=document.querySelector('input[name="'+s.id+'-comment"]').value.trim();return s.dataset.title+'：'+choice+(comment?'\n'+comment:'')}).join('\n\n')}
function update(){document.getElementById('answers').value=answerText()}
for(const input of document.querySelectorAll('input'))input.addEventListener('input',update);
document.getElementById('copy').addEventListener('click',async()=>{update();try{await navigator.clipboard.writeText(answerText());document.getElementById('copy-status').textContent='コピーしました'}catch{document.getElementById('answers').select();document.getElementById('copy-status').textContent='回答文を選択しました'}});
</script></html>
