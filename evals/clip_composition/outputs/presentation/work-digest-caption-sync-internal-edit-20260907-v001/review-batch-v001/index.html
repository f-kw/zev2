<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>短い比較で確認する</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#182737;font:16px/1.6 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{margin:8px 0}header{margin-bottom:20px}.muted{color:#657386;font-size:14px}.layout{display:grid;grid-template-columns:275px minmax(0,1fr);gap:20px}button{font:inherit;cursor:pointer;border:1px solid #c7d1de;background:white;color:#182737;border-radius:8px;padding:10px 14px}button:focus-visible,textarea:focus-visible{outline:3px solid #5b9cf0;outline-offset:2px}button:hover{background:#edf2f9}button[aria-pressed=true]{background:#163e72;color:white;border-color:#163e72}.case{display:block;width:100%;text-align:left;margin-bottom:9px;padding:11px 13px}.case small{display:block;font-size:12px}.panel{background:white;border:1px solid #dce2e9;border-radius:12px;padding:18px}h2{font-size:21px;margin:0 0 8px}.clips,.answer-buttons,.pager{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}video{display:block;width:100%;max-height:49vh;min-height:150px;background:#101010;border-radius:8px}#clipLabel{font-weight:650}#marker{min-height:26px;font-size:14px;color:#935100}.question{font-weight:650;font-size:18px;margin-top:10px}textarea{display:block;width:100%;font:inherit;padding:9px;border:1px solid #c7d1de;border-radius:7px;resize:vertical}#memo{min-height:65px}#confirmed{background:#e9f5ed;padding:12px;border-radius:8px}.pager{justify-content:space-between;margin-bottom:0}details{margin-top:18px}summary{cursor:pointer}#summaryText{height:215px;margin-top:10px}a{color:#164f99}#storageWarning{color:#a04020}@media(max-width:760px){main{padding:15px}.layout{grid-template-columns:1fr}.cases{display:grid;grid-template-columns:1fr 1fr;gap:7px}.case{margin:0;padding:8px;font-size:13px}.panel{padding:13px}video{max-height:43vh}h1{font-size:23px}}
</style>
<main><header><h1>短い比較で確認する</h1><p>一か所ずつ、削除前 → 削除後を見比べてください。途中で止めても大丈夫です。</p><p class="muted" id="progress"></p></header>
<div class="layout"><aside><nav class="cases" id="cases" aria-label="比較する箇所"></nav><p class="muted">一回の再生は最大31秒。長い削除前は、続きの二本に分けています。</p></aside>
<section class="panel"><h2 id="title"></h2><p id="removed"></p><p class="question" id="question"></p><div class="clips" id="clips" aria-label="削除前と削除後"></div><p class="muted" id="split"></p><p id="clipLabel"></p><video id="player" controls playsinline preload="metadata"></video><p id="marker" aria-live="polite"></p><div id="confirmed" hidden></div><div id="answerArea"><div class="answer-buttons" id="answers"><button data-answer="問題なし">問題なし</button><button data-answer="気になる">気になる</button><button data-answer="保留">保留</button><button id="clearAnswer">回答を取り消す</button></div><label for="memo" class="muted">ひと言メモ（任意）</label><textarea id="memo" placeholder="気になったことがあれば"></textarea><p class="muted" id="saveState"></p><p id="storageWarning" hidden>このブラウザーには保存できません。回答のまとめを控えてください。</p></div><div class="pager"><button id="prev">前の箇所</button><button id="next">次の未確認へ</button></div></section></div>
<details><summary>回答のまとめを見る</summary><p class="muted">この内容をまとめて伝えられます。回答はこのブラウザーに保存されます。</p><textarea id="summaryText" readonly aria-label="回答のまとめ"></textarea></details></main>
<script>
const cases=[{"id": "move", "title": "移動を促す呼びかけ", "removed": "「早よ上行ってお前！」を削除。", "question": "呼びかけを削って、反応の流れに違和感があるか。", "before": [[0, 570]], "after": [0, 462], "cut": [340, 448], "number": 1, "clips": [{"file": "move-before-1.mp4", "label": "削除前", "duration": 19.0, "mode": "before", "startFrame": 0, "endFrame": 570, "markStart": 11.333333333333334, "markEnd": 14.933333333333334}, {"file": "move-after.mp4", "label": "削除後", "duration": 15.4, "mode": "after", "startFrame": 0, "endFrame": 462}], "confirmed": "問題なし"}, {"id": "speed", "title": "急加速への最初の反応", "removed": "走る速さの再説明、方向確認、最初の「急に速くなった！」を削除。", "question": "短い方でも、急に速くなった驚きが伝わるか。", "before": [[722, 1209], [1209, 1696]], "after": [614, 917], "cut": [864, 1535], "number": 2, "clips": [{"file": "speed-before-1.mp4", "label": "削除前 1/2", "duration": 16.233333333333334, "mode": "before", "startFrame": 722, "endFrame": 1209, "markStart": 4.733333333333333, "markEnd": 16.233333333333334}, {"file": "speed-before-2.mp4", "label": "削除前 2/2", "duration": 16.233333333333334, "mode": "before", "startFrame": 1209, "endFrame": 1696, "markStart": 0, "markEnd": 10.866666666666667}, {"file": "speed-after.mp4", "label": "削除後", "duration": 10.1, "mode": "after", "startFrame": 614, "endFrame": 917}], "confirmed": "問題なし"}, {"id": "name", "title": "感想の前の名前確認", "removed": "「ペコラ、ペコラじゃなかったのかな」を削除。", "question": "短い方の感想の入り方に違和感があるか。", "before": [[3776, 4123]], "after": [2997, 3286], "cut": [3776, 3834], "number": 3, "clips": [{"file": "name-before-1.mp4", "label": "削除前", "duration": 11.566666666666666, "mode": "before", "startFrame": 3776, "endFrame": 4123, "markStart": 0, "markEnd": 1.9333333333333333}, {"file": "name-after.mp4", "label": "削除後", "duration": 9.633333333333333, "mode": "after", "startFrame": 2997, "endFrame": 3286}], "confirmed": "問題なし"}, {"id": "buttons", "title": "ボタン連打の話", "removed": "新要素のボタン連打に驚いた話を削除。", "question": "短い方で、話のつながりに違和感があるか。", "before": [[4123, 5053]], "after": [3286, 3881], "cut": [4400, 4735], "confirmed": "切り替わったのわかるけど違和感はないよ", "number": 4, "clips": [{"file": "buttons-before-1.mp4", "label": "削除前", "duration": 31.0, "mode": "before", "startFrame": 4123, "endFrame": 5053, "markStart": 9.233333333333333, "markEnd": 20.4}, {"file": "buttons-after.mp4", "label": "削除後", "duration": 19.833333333333332, "mode": "after", "startFrame": 3286, "endFrame": 3881}]}, {"id": "example", "title": "別作品とトイレの具体例", "removed": "「ビー玉ばあちゃん」の話から、トイレで何も起きなかったという具体例までを削除。", "question": "具体例を削った短い方でも、感想が伝わるか。", "before": [[5403, 5943], [5943, 6478]], "after": [4231, 4552], "cut": [5554, 6308], "number": 5, "clips": [{"file": "example-before-1.mp4", "label": "削除前 1/2", "duration": 18.0, "mode": "before", "startFrame": 5403, "endFrame": 5943, "markStart": 5.033333333333333, "markEnd": 18.0}, {"file": "example-before-2.mp4", "label": "削除前 2/2", "duration": 17.833333333333332, "mode": "before", "startFrame": 5943, "endFrame": 6478, "markStart": 0, "markEnd": 12.166666666666666}, {"file": "example-after.mp4", "label": "削除後", "duration": 10.7, "mode": "after", "startFrame": 4231, "endFrame": 4552}], "confirmed": "問題なし"}, {"id": "ending", "title": "赤ちゃんを盾にした話", "removed": "赤ちゃんを盾にできて助かったという最後の話を削除。", "question": "短い方の終わり方が唐突に感じるか。", "before": [[6308, 7128]], "after": [4382, 4831], "cut": [6757, 7128], "number": 6, "clips": [{"file": "ending-before-1.mp4", "label": "削除前", "duration": 27.333333333333332, "mode": "before", "startFrame": 6308, "endFrame": 7128, "markStart": 14.966666666666667, "markEnd": 27.333333333333332}, {"file": "ending-after.mp4", "label": "削除後", "duration": 14.966666666666667, "mode": "after", "startFrame": 4382, "endFrame": 4831}], "confirmed": "問題なし"}];
const $=id=>document.getElementById(id),storageKey='zev2-short-review-batch-v001';let answers={};try{answers=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
let index=0,clipIndex=0;const v=$('player');
function state(c){return c.confirmed?'確認済み':answers[c.id]?.answer||'未確認'}
function refresh(){const pending=cases.filter(c=>!c.confirmed&&!answers[c.id]?.answer).length;const held=cases.filter(c=>!c.confirmed&&answers[c.id]?.answer==='保留').length;$('progress').textContent=`全6か所 · 未回答 ${pending}か所${held?' · 保留 '+held+'か所':''} · 確認済み ${cases.filter(c=>c.confirmed).length}か所`;$('next').disabled=pending===0;$('next').textContent=pending===0?'6か所すべて確認済み':'次の未確認へ';$('cases').replaceChildren();cases.forEach((c,i)=>{const b=document.createElement('button');b.className='case';b.setAttribute('aria-pressed',String(i===index));const t=document.createElement('span');t.textContent=`${i+1}. ${c.title}`;const s=document.createElement('small');s.textContent=state(c);b.append(t,s);b.onclick=()=>selectCase(i);$('cases').append(b)});$('summaryText').value=cases.map((c,i)=>`${i+1}. ${c.title}：${c.confirmed?'確認済み「'+c.confirmed+'」':state(c)}${answers[c.id]?.memo?'\n   '+answers[c.id].memo:''}`).join('\n');}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(answers));$('saveState').textContent='保存しました';$('storageWarning').hidden=true}catch(e){$('storageWarning').hidden=false}refresh()}
function selectClip(j,play=false){v.pause();clipIndex=j;const c=cases[index],x=c.clips[j];v.src=x.file;$('clipLabel').textContent=`${x.label} · ${x.duration.toFixed(1)}秒`;$('marker').textContent='';Array.from($('clips').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(i===j)));if(play)v.play().catch(()=>{$('marker').textContent='動画の再生ボタンを押してください';});}
function selectCase(i){v.pause();index=i;const c=cases[i];$('title').textContent=`${i+1}. ${c.title}`;$('removed').textContent=c.removed;$('question').textContent=c.question;$('split').textContent=c.before.length>1?'削除前の①と②は続きです。別々に再生してから削除後と比べられます。':'';$('clips').replaceChildren();c.clips.forEach((x,j)=>{const b=document.createElement('button');b.textContent=`${x.label} · ${x.duration.toFixed(1)}秒`;b.onclick=()=>selectClip(j,true);$('clips').append(b)});$('confirmed').hidden=!c.confirmed;$('answerArea').hidden=!!c.confirmed;$('confirmed').textContent=c.confirmed?'確認済み：「'+c.confirmed+'」':'';$('memo').value=answers[c.id]?.memo||'';$('saveState').textContent='';document.querySelectorAll('[data-answer]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.answer===answers[c.id]?.answer)));selectClip(0);refresh();}
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const c=cases[index];answers[c.id]={...answers[c.id],answer:b.dataset.answer};document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save()});
$('clearAnswer').onclick=()=>{delete answers[cases[index].id];save();selectCase(index)};
$('memo').oninput=()=>{const c=cases[index];answers[c.id]={...answers[c.id],memo:$('memo').value};save()};
$('prev').onclick=()=>selectCase((index+cases.length-1)%cases.length);
$('next').onclick=()=>{for(let n=1;n<=cases.length;n++){const j=(index+n)%cases.length;if(!cases[j].confirmed&&!answers[cases[j].id]?.answer){selectCase(j);return;}}selectCase((index+1)%cases.length);};
v.ontimeupdate=()=>{const c=cases[index],x=c.clips[clipIndex];$('marker').textContent=x.mode==='before'&&v.currentTime>=x.markStart&&v.currentTime<x.markEnd?'ここが削った部分です':''};
v.onended=()=>{const c=cases[index],x=c.clips[clipIndex];if(x.mode==='before'&&clipIndex+1<c.clips.length&&c.clips[clipIndex+1].mode==='before')$('marker').textContent='続きは「削除前 2/2」です';else if(x.mode==='after'&&c.id==='ending')$('marker').textContent='短い方はここで終わります';};
v.onerror=()=>{$('marker').textContent='動画を読み込めませんでした。ページを開き直してください。'};
selectCase(0);
</script></html>
