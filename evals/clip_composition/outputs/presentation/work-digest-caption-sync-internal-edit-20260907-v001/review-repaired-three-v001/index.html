<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕3か所の最終確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172a3d;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 6px}h2{font-size:20px}p{margin:6px 0}.muted{color:#637386;font-size:14px}nav{display:flex;gap:8px;margin:18px 0}button,select,textarea{font:inherit;border:1px solid #bac8d6;border-radius:8px;padding:9px 13px;background:white;color:inherit}button{cursor:pointer}button[aria-pressed=true],.primary{background:#164675;color:white}button:disabled{opacity:.55;cursor:default}.panel{background:white;border:1px solid #dbe2e9;border-radius:14px;padding:18px}video{display:block;width:100%;max-height:46vh;background:#111;border-radius:9px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}label{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:12px 0}textarea{width:100%;min-height:70px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #679fdf;outline-offset:2px}#status{min-height:25px;color:#1d684b}#error{color:#ac351d}@media(max-width:650px){main{padding:12px}nav{flex-direction:column}label{align-items:start;flex-direction:column}video{max-height:40vh}}</style>
<main><h1>字幕3か所の最終確認</h1><p>修正した3か所だけ、各20秒です。動画を見て、下の項目に回答してください。</p><p id="progress" class="muted"></p><nav id="tabs" aria-label="確認する箇所"></nav><section class="panel"><h2 id="title"></h2><p id="question"></p><video id="player" playsinline preload="metadata"></video><div class="controls"><button id="play">最初から再生</button><button id="pause">一時停止</button><button id="resume">続きから再生</button></div><p id="clock" class="muted"></p><div id="fields"></div><label for="memo">ひと言メモ（任意）</label><textarea id="memo" placeholder="気になる所や、判断しづらい所があれば"></textarea><div class="controls"><button id="save" class="primary">この箇所の回答を保存</button><button id="next">次の箇所へ</button></div><p id="status" aria-live="polite"></p><p id="error" role="alert"></p></section></main><script src="/app.js"></script></html>
