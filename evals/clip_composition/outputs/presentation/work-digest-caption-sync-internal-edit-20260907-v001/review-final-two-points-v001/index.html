<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>残る2点の短い確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#182737;font:16px/1.6 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:22px}h1{font-size:26px;margin:0 0 8px}p{margin:7px 0}.muted{color:#647285;font-size:14px}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:18px;margin-top:18px}button,select{font:inherit;color:#182737;background:white;border:1px solid #bdc9d9;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover{background:#edf2f9}button[aria-pressed=true]{background:#163e72;color:white;border-color:#163e72}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #5b9cf0;outline-offset:2px}.group{display:block;width:100%;text-align:left;margin-bottom:8px}.group small{display:block;font-size:12px}.panel{background:white;border:1px solid #dce2e9;border-radius:12px;padding:17px}h2{font-size:21px;margin:0 0 8px}.question{font-weight:650;font-size:18px}video{display:block;width:100%;max-height:45vh;background:#101010;border-radius:8px;margin:12px 0 5px}.bar,.pager{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pager{justify-content:space-between}.item{border-top:1px solid #e2e7ee;padding:14px 0}.item h3{font-size:16px;margin:0 0 9px}.choices{display:flex;gap:12px;flex-wrap:wrap}.choices label{display:flex;gap:8px;align-items:center}select{padding:7px 8px}textarea{width:100%;font:inherit;padding:8px;border:1px solid #bdc9d9;border-radius:7px;min-height:62px;resize:vertical}#marker{min-height:23px;color:#8a5000;font-size:14px}#warning{color:#a04020}details{margin-top:18px}summary{cursor:pointer}#summaryText{height:300px;margin-top:10px}@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}.groups{display:grid;grid-template-columns:1fr 1fr;gap:7px}.group{font-size:13px;margin:0}.panel{padding:13px}video{max-height:42vh}h1{font-size:23px}.choices{display:grid;grid-template-columns:1fr}.choices label{justify-content:space-between}}</style>
<main><h1>残る2点の短い確認</h1><p>字幕8件と、場面の切り替わり2か所だけです。動画は現在の完成版をそのまま切り出しています。</p><p class="muted" id="progress"></p><div class="layout"><aside><nav class="groups" id="groups" aria-label="確認する動画"></nav><p class="muted">1本20〜28秒。同じ動画に入る字幕はまとめています。確認済みの6か所の削除は見直しません。</p></aside><section class="panel"><h2 id="title"></h2><p class="question" id="question"></p><p class="muted" id="duration"></p><video id="player" controls playsinline preload="metadata"></video><p id="marker" aria-live="polite"></p><div class="bar"><button id="replay">最初から再生</button><button id="allGood">この動画の項目はすべて問題なし</button></div><p class="muted">気になる所があれば下で個別に選べます。判断しづらい所は「判別できない」で大丈夫です。</p><div id="items"></div><label for="memo" class="muted">ひと言メモ（任意）</label><textarea id="memo" placeholder="気になった字幕や切り替わりについて"></textarea><p class="muted" id="saved"></p><p id="warning" hidden>このブラウザーに保存できません。回答のまとめを控えてください。</p><div class="pager"><button id="clear">この動画の回答を取り消す</button><button id="next">次の未回答へ</button></div></section></div><details><summary>回答のまとめを見る</summary><p class="muted">回答はこのブラウザーに保存されます。まとめて確認した後、この内容を伝えられます。</p><textarea id="summaryText" aria-label="回答のまとめ" readonly></textarea></details></main>
<script>
const groups=[{"id": "sync-opening", "kind": "caption", "title": "字幕：冒頭と逃走", "startFrame": 0, "endFrame": 660, "ordinals": [1, 2, 11], "file": "sync-opening.mp4", "duration": 22.0, "targets": [{"id": "caption-1", "ordinal": 1, "text": "え?いるんでしょ?", "startFrame": 0, "endFrame": 8, "unresolvedStart": true, "unresolvedEnd": true}, {"id": "caption-2", "ordinal": 2, "text": "あーもういるやん", "startFrame": 8, "endFrame": 13, "unresolvedStart": true, "unresolvedEnd": false}, {"id": "caption-11", "ordinal": 11, "text": "逃げるやつ?", "startFrame": 462, "endFrame": 544, "unresolvedStart": true, "unresolvedEnd": false}]}, {"id": "sync-capture", "kind": "caption", "title": "字幕：捕まった後", "startFrame": 1350, "endFrame": 1950, "ordinals": [15], "file": "sync-capture.mp4", "duration": 20.0, "targets": [{"id": "caption-15", "ordinal": 15, "text": "なんかグロいやつに捕まってる", "startFrame": 1494, "endFrame": 1794, "unresolvedStart": true, "unresolvedEnd": false}]}, {"id": "sync-place", "kind": "caption", "title": "字幕：場所を確かめる所", "startFrame": 2250, "endFrame": 3090, "ordinals": [16, 17, 18], "file": "sync-place.mp4", "duration": 28.0, "targets": [{"id": "caption-16", "ordinal": 16, "text": "どこ?", "startFrame": 2673, "endFrame": 2918, "unresolvedStart": true, "unresolvedEnd": true}, {"id": "caption-17", "ordinal": 17, "text": "何これ?", "startFrame": 2918, "endFrame": 2929, "unresolvedStart": true, "unresolvedEnd": true}, {"id": "caption-18", "ordinal": 18, "text": "なんか棺みたいなところに入れられてる!", "startFrame": 2929, "endFrame": 2997, "unresolvedStart": true, "unresolvedEnd": false}]}, {"id": "sync-comment", "kind": "caption", "title": "字幕：怖がらせ方の感想", "startFrame": 4020, "endFrame": 4620, "ordinals": [30], "file": "sync-comment.mp4", "duration": 20.0, "targets": [{"id": "caption-30", "ordinal": 30, "text": "油断させてビビらせてくるのがマジでここの会社多いなって思う", "startFrame": 4231, "endFrame": 4382, "unresolvedStart": true, "unresolvedEnd": false}]}, {"id": "join-1-2", "kind": "join", "title": "場面1 → 場面2", "startFrame": 180, "endFrame": 780, "boundaryFrame": 462, "file": "join-1-2.mp4", "duration": 20.0}, {"id": "join-2-3", "kind": "join", "title": "場面2 → 場面3", "startFrame": 2697, "endFrame": 3297, "boundaryFrame": 2997, "file": "join-2-3.mp4", "duration": 20.0}];const $=id=>document.getElementById(id),v=$('player'),key='zev2-final-two-points-review-v001';let current=0,answers={},memos={};try{const s=JSON.parse(localStorage.getItem(key)||'{}');answers=s.answers||{};memos=s.memos||{}}catch(e){}
const captionFields=[['start','出始め'],['end','消え方']],joinFields=[['sudden','切り替わりが唐突でないか'],['lingering','前の場面を引きずりすぎていないか'],['focus','次の場面に自然に集中できるか']];
function targets(g){return g.kind==='caption'?g.targets:[{id:g.id,text:g.title}]}
function fields(g){return g.kind==='caption'?captionFields:joinFields}
function complete(g,t){return fields(g).every(([f])=>!!answers[t.id]?.[f])}
function groupState(g){const vals=targets(g).flatMap(t=>fields(g).map(([f])=>answers[t.id]?.[f]));if(vals.some(x=>x==='早い'||x==='遅い'||x==='気になる'))return '気になる箇所あり';if(vals.some(x=>x==='判別できない'))return '判別できず';return vals.every(Boolean)?'回答済み':'未回答'}
function refresh(){const count=groups.reduce((n,g)=>n+targets(g).filter(t=>complete(g,t)).length,0);$('progress').textContent=`回答済み ${count}/10件 · 字幕8件／場面間2件`;$('groups').replaceChildren();groups.forEach((g,i)=>{const b=document.createElement('button');b.className='group';b.setAttribute('aria-pressed',String(i===current));const text=document.createElement('span');text.textContent=g.title;const small=document.createElement('small');small.textContent=`${g.duration}秒 · ${groupState(g)}`;b.append(text,small);b.onclick=()=>show(i);$('groups').append(b)});$('next').disabled=count===10;$('next').textContent=count===10?'10件すべて回答済み':'次の未回答へ';$('summaryText').value=groups.map(g=>g.title+'\n'+targets(g).map(t=>t.text+'：'+fields(g).map(([f,label])=>label+' '+(answers[t.id]?.[f]||'未回答')).join('／')).join('\n')+(memos[g.id]?'\nメモ：'+memos[g.id]:'')).join('\n\n')}
function save(){try{localStorage.setItem(key,JSON.stringify({answers,memos}));$('saved').textContent='保存しました';$('warning').hidden=true}catch(e){$('warning').hidden=false}refresh()}
function show(i){v.pause();current=i;const g=groups[i];$('title').textContent=g.title;$('question').textContent=g.kind==='caption'?'字幕の出始め・消え方は、声と合っているか。':'場面の切り替わりは、自然に見られるか。';$('duration').textContent=`${g.duration}秒${g.kind==='caption'?' · '+g.targets.length+'字幕を確認':''}`;v.src=g.file;$('marker').textContent='';$('items').replaceChildren();targets(g).forEach(t=>{const item=document.createElement('div');item.className='item';const h=document.createElement('h3');h.textContent=t.text;item.append(h);const choices=document.createElement('div');choices.className='choices';fields(g).forEach(([f,label])=>{const l=document.createElement('label'),s=document.createElement('select'),span=document.createElement('span');span.textContent=label;s.setAttribute('aria-label',t.text+' '+label);const options=g.kind==='caption'?['','問題なし','早い','遅い','判別できない']:['','問題なし','気になる','判別できない'];options.forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=value||'未回答';s.append(o)});s.value=answers[t.id]?.[f]||'';s.onchange=()=>{answers[t.id]={...answers[t.id],[f]:s.value};save()};l.append(span,s);choices.append(l)});item.append(choices);$('items').append(item)});$('memo').value=memos[g.id]||'';$('saved').textContent='';refresh()}
$('replay').onclick=()=>{v.currentTime=0;v.play().catch(()=>{})};$('allGood').onclick=()=>{const g=groups[current];targets(g).forEach(t=>{answers[t.id]=Object.fromEntries(fields(g).map(([f])=>[f,'問題なし']))});save();const time=v.currentTime,paused=v.paused;show(current);v.addEventListener('loadedmetadata',()=>{v.currentTime=time;if(!paused)v.play().catch(()=>{})},{once:true})};
$('clear').onclick=()=>{const g=groups[current];targets(g).forEach(t=>delete answers[t.id]);delete memos[g.id];save();show(current)};$('memo').oninput=()=>{memos[groups[current].id]=$('memo').value;save()};$('next').onclick=()=>{for(let n=1;n<=groups.length;n++){const i=(current+n)%groups.length;if(targets(groups[i]).some(t=>!complete(groups[i],t))){show(i);return}}};
v.ontimeupdate=()=>{const g=groups[current];if(g.kind==='join'){$('marker').textContent=Math.abs(v.currentTime-(g.boundaryFrame-g.startFrame)/30)<1?'ここで場面が切り替わります':''}else{const t=g.targets.find(t=>v.currentTime>=(t.startFrame-g.startFrame)/30&&v.currentTime<(t.endFrame-g.startFrame)/30);$('marker').textContent=t?'確認対象の字幕：'+t.text:''}};v.onerror=()=>{$('marker').textContent='動画を読み込めませんでした。ページを開き直してください。'};show(0);
</script></html>
