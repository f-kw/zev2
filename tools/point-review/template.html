<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src file:; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ZEV｜ポイントレビュー</title><style>/*__STYLE__*/</style></head>
<body><main>
<header><p class="eyebrow">ZEV · ポイントレビュー</p><h1 id="batch-title"></h1><p id="intro" class="muted"></p><p class="muted">一つの問いを数秒ずつ確認します。選んだ区間の終わりで止まります。</p></header>
<nav aria-label="ポイント一覧" id="point-nav"></nav>
<section class="point" aria-labelledby="point-title">
  <div class="point-heading"><span id="point-number" class="eyebrow"></span><span id="answer-state" class="badge">未回答</span></div>
  <h2 id="point-title" tabindex="-1"></h2><p id="question" class="question"></p>
  <p id="change-summary" class="muted"></p><p id="why-review" class="muted"></p>
  <div id="view-controls" class="buttons" aria-label="見る動画"></div>
  <p id="view-label" class="view-label"></p>
  <video id="video" preload="metadata" playsinline aria-label="選んだポイントの動画"></video>
  <div class="buttons playback"><button id="play" class="primary" disabled>この箇所を見る</button><button id="replay" disabled>もう一度</button><button id="pause">一時停止</button><button id="context" aria-pressed="false">前後を少し広げる</button></div>
  <progress id="progress" max="1" value="0" aria-label="区間の再生位置"></progress>
  <p id="playback-status" class="status" role="status"></p>
  <p class="scope"><strong>この回答を反映する範囲：</strong><span id="applies-to"></span></p>
  <p class="muted small"><strong>この回答では判断しない：</strong><span id="does-not-apply"></span></p>
  <fieldset><legend>この問いへの回答 <span class="muted small">（任意）</span></legend><div id="choices" class="buttons"></div></fieldset>
  <label for="comment">ひとこと <span class="muted small">（任意・理由や点数は不要）</span></label><textarea id="comment" rows="2" placeholder="気になった箇所など"></textarea>
  <p class="muted small">「良い」は、このポイントへの感想として保存します。機能の正式な使用許可や全編の合格へは自動で変えません。</p>
  <div class="buttons page-nav"><button id="previous">前のポイント</button><button id="next" class="primary">次のポイント</button></div>
</section>
<section class="reply"><h2>回答を残す</h2><p>この端末へ自動保存します。取り出した回答ファイルは、元の会話へ返せます。チャットで回答する場合は、ポイント名を添えるだけでも構いません。</p><div class="buttons"><button id="export">回答を取り出す</button><button id="import">保存した回答を読み込む</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><p id="save-status" class="status" role="status"></p><p id="summary" class="small"></p></section>
<details><summary>対象と記録</summary><p id="binding" class="small"></p><p id="technical" class="small"></p><p class="small">再生開始の記録は、視聴完了や人間品質の合格を意味しません。</p></details>
<noscript>このローカルレビューはJavaScriptを有効にして開いてください。</noscript>
</main><script type="application/json" id="review-package">/*__DATA__*/</script><script>/*__SCRIPT__*/</script></body></html>
